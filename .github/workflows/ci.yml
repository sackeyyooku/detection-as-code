name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Quality gates and behavioural replay tests
        run: python -m pytest -q

      - name: Compile rules to Splunk SPL and KQL
        run: python -m tools.convert

      - name: Generate ATT&CK coverage
        run: python -m tools.coverage

      - name: Generated docs are committed and current
        run: git diff --exit-code docs/

      - name: Publish compiled detections
        uses: actions/upload-artifact@v4
        with:
          name: compiled-detections
          path: build/
