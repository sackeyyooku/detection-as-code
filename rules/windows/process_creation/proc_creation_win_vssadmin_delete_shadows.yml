title: Volume Shadow Copy Deletion via VSSAdmin
id: ebe52352-97ec-4aca-8e1b-ee7affc98fe8
status: experimental
description: >
    Detects deletion of Volume Shadow Copies using vssadmin.exe. A near-universal precursor to
    ransomware encryption, used to remove the victim's local recovery points.
references:
    - https://attack.mitre.org/techniques/T1490/
author: George Yooku Sackey
date: 2026-11-11
tags:
    - attack.impact
    - attack.t1490
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\vssadmin.exe'
        - OriginalFileName: 'VSSADMIN.EXE'
    selection_cli:
        CommandLine|contains|all:
            - 'delete'
            - 'shadows'
    condition: all of selection_*
falsepositives:
    - Legitimate backup or storage maintenance scripts run by administrators
level: high
