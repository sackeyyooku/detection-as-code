title: Office Application Spawning Shell or Script Interpreter
id: 25c8bc5d-cc0e-4c9a-a68e-a5899d86fb65
status: experimental
description: >
    Detects a Microsoft Office application launching a command shell or script host.
    Classic macro / malicious-document execution chain following a phishing delivery.
references:
    - https://attack.mitre.org/techniques/T1204/002/
    - https://attack.mitre.org/techniques/T1059/
author: George Yooku Sackey
date: 2026-11-11
tags:
    - attack.execution
    - attack.t1204.002
    - attack.t1059
logsource:
    category: process_creation
    product: windows
detection:
    selection_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\outlook.exe'
    selection_child:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\mshta.exe'
    condition: all of selection_*
falsepositives:
    - Line-of-business Office add-ins or macros that legitimately shell out
level: high
