title: Certutil File Download via URL Cache
id: 71766494-5f2e-428c-adf0-eb44097c6a2a
status: experimental
description: >
    Detects certutil.exe used to fetch remote content (urlcache / verifyctl with a URL).
    A living-off-the-land technique for ingress tool transfer that avoids dropping a downloader.
references:
    - https://attack.mitre.org/techniques/T1105/
    - https://lolbas-project.github.io/lolbas/Binaries/Certutil/
author: George Yooku Sackey
date: 2026-11-11
tags:
    - attack.command-and-control
    - attack.t1105
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\certutil.exe'
        - OriginalFileName: 'CertUtil.exe'
    selection_mode:
        CommandLine|contains:
            - 'urlcache'
            - 'verifyctl'
    selection_url:
        CommandLine|contains:
            - 'http://'
            - 'https://'
            - 'ftp://'
    condition: all of selection_*
falsepositives:
    - Rare administrative use of certutil to retrieve CRLs or certificates over HTTP
level: high
