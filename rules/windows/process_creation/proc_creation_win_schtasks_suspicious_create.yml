title: Scheduled Task Created With Suspicious Action or Path
id: ffb69a7a-03a2-481e-b5f9-cbdb63c0e2c1
status: experimental
description: >
    Detects schtasks.exe creating a task whose command references user-writable paths or
    script/LOLBin launchers. Common persistence and execution mechanism.
references:
    - https://attack.mitre.org/techniques/T1053/005/
author: George Yooku Sackey
date: 2026-11-11
tags:
    - attack.persistence
    - attack.execution
    - attack.privilege-escalation
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\schtasks.exe'
        - OriginalFileName: 'schtasks.exe'
    selection_create:
        CommandLine|contains: ' /create '
    selection_susp:
        CommandLine|contains:
            - '\AppData\'
            - '\Temp\'
            - '\Users\Public\'
            - 'powershell'
            - 'cmd /c'
            - 'cmd.exe /c'
            - 'mshta'
            - 'wscript'
            - 'rundll32'
    condition: all of selection_*
falsepositives:
    - Installers and updaters that register tasks pointing at user-profile paths
level: medium
