title: PowerShell Encoded Command Execution
id: e1876af4-17e9-43fe-b244-5f89b67b71a2
status: experimental
description: >
    Detects PowerShell launched with an encoded command argument. Commonly used to obscure
    payloads in phishing droppers, commodity malware and hands-on-keyboard activity.
    Also matches renamed PowerShell binaries via the OriginalFileName PE attribute.
references:
    - https://attack.mitre.org/techniques/T1059/001/
    - https://attack.mitre.org/techniques/T1027/010/
author: George Yooku Sackey
date: 2026-11-11
tags:
    - attack.execution
    - attack.t1059.001
    - attack.stealth
    - attack.t1027.010
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith:
              - '\powershell.exe'
              - '\pwsh.exe'
        - OriginalFileName:
              - 'PowerShell.EXE'
              - 'pwsh.dll'
    selection_cli:
        CommandLine|contains:
            - ' -e '
            - ' -en '
            - ' -enc '
            - ' -ec '
            - ' -encodedcommand '
    condition: all of selection_*
falsepositives:
    - Software deployment and management tooling (SCCM, Intune, RMM agents) that passes encoded scripts
    - Administrator scripts that encode commands for quoting reasons
level: medium
