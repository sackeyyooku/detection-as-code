title: Suspicious Process Access to LSASS
id: 325efed4-a841-44df-b317-25bcc98e6a0a
status: experimental
description: >
    Detects processes opening a handle to lsass.exe with access rights typically used for
    credential dumping, excluding common system and Defender sources. Requires Sysmon Event ID 10.
references:
    - https://attack.mitre.org/techniques/T1003/001/
author: George Yooku Sackey
date: 2026-11-11
tags:
    - attack.credential-access
    - attack.t1003.001
logsource:
    category: process_access
    product: windows
detection:
    selection:
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess:
            - '0x1010'
            - '0x1410'
            - '0x1438'
            - '0x143a'
            - '0x1fffff'
    filter_main_system:
        SourceImage|startswith:
            - 'C:\Windows\System32\'
            - 'C:\Windows\SysWOW64\'
            - 'C:\ProgramData\Microsoft\Windows Defender\Platform\'
            - 'C:\Program Files\Windows Defender\'
    condition: selection and not 1 of filter_main_*
falsepositives:
    - EDR / AV agents not yet allow-listed in the filter
    - Legitimate memory-diagnostics or crash-dump tooling
level: high
