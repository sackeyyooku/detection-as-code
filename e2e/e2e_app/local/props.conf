# Sysmon-style test events are one JSON object per event. Splunk's built-in auto-extraction handles them;
# index-time stamping keeps timestamps inside command lines from moving an event outside the search window.
# Windows Security events are NOT JSON: they use the classic WinEventLog text format and Splunk's own
# built-in extractions, exactly as in production, so no override is configured for them.
[e2e_json]
KV_MODE = json
SHOULD_LINEMERGE = false
DATETIME_CONFIG = CURRENT
