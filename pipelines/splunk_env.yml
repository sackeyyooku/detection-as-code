# Environment mapping: where each Sigma logsource lives in *your* Splunk.
# Edit the source / index values to match your deployment.
name: Splunk environment - Sysmon sources
priority: 30
transformations:
  - id: splunk_sysmon_process_creation
    type: add_condition
    conditions:
      source: 'XmlWinEventLog:Microsoft-Windows-Sysmon/Operational'
      EventCode: 1
    rule_conditions:
      - type: logsource
        category: process_creation
        product: windows
  - id: splunk_sysmon_process_access
    type: add_condition
    conditions:
      source: 'XmlWinEventLog:Microsoft-Windows-Sysmon/Operational'
      EventCode: 10
    rule_conditions:
      - type: logsource
        category: process_access
        product: windows
  # Windows Security events in Splunk's classic WinEventLog format use underscore-separated names
  # extracted from the message text (verified against a real Splunk: Service_Name,
  # Ticket_Encryption_Type, Failure_Code) and SourceName instead of the XML Provider name.
  # Sigma rules use the Event Viewer XML names, so map them here and keep the rules portable.
  - id: splunk_classic_security_fields
    type: field_name_mapping
    mapping:
      ServiceName: Service_Name
      TicketEncryptionType: Ticket_Encryption_Type
      Status: Failure_Code
      Provider_Name: SourceName
    rule_conditions:
      - type: logsource
        product: windows
        service: security
